<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cálculadora IMC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="container-lg">

    <section>    

        <h1 class="mt-4 mb-4 text-center">Cálculadora IMC</h1>

        <form name="cadastro" action="#">
            
            <div class="mb-4">
                <label for="nome" class="form-label">Nome</label>
                <input type="text" class="form-control" name="nome" id="nome" aria-describedby="nome">                
            </div>

            <div class="row mb-4">

                <div class="col">
                    <label for="idade" class="form-label">Altura (M)</label>
                    <input type="text" class="form-control" name="altura" id="altura">
                </div>  

                <div class="col">
                    <label for="idade" class="form-label">Peso (Kg)</label>
                    <input type="text" class="form-control" name="peso" id="peso"> 
                    
                </div>              

            </div>

            <div class="text-end">

                <button type="submit" class="btn btn-primary">Salvar</button>  

            </div>
        </form>

    </section>

    <section>  

        <table class="table table-striped mt-4" name="tabela" id="tabela">
        <thead>
            <tr>
            <th scope="col">#</th>
            <th scope="col">Data</th>
            <th scope="col">Nome</th>
            <th scope="col">Altura (M)</th>
            <th scope="col">Peso (Kg)</th>
            <th scope="col">IMC</th>
            <th scope="col">Classificação</th>
            </tr>            
        </thead>
        <tbody>
                    
        </tbody>
        </table>

    </section>     

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <script src="js/script.js"></script>

</body>
</html>
