<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cálculadora IMC</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" type="text/css" href="css/style.css" />
  </head>
  <body>
    <div class="container-lg">
      <section>
        <h1 class="mt-4 mb-5 text-center">Calculadora IMC</h1>

        <form name="cadastro" action="#">
          <div class="mb-4">
            <label for="nome" class="form-label">Nome</label>
            <input type="text" class="form-control" name="nome" id="nome" />
            <div id="erroNome" class="form-text ocultar alerta">
              Deve ser preenchido
            </div>
          </div>

          <div class="row mb-4">
            <div class="col">
              <label for="idade" class="form-label">Altura (M)</label>
              <input
                type="text"
                class="form-control"
                name="altura"
                id="altura"
              />
              <div id="erroAltura" class="form-text ocultar alerta">
                Deve ser preenchido
              </div>
            </div>

            <div class="col">
              <label for="idade" class="form-label">Peso (Kg)</label>
              <input type="text" class="form-control" name="peso" id="peso" />
              <div id="erroPeso" class="form-text ocultar alerta">
                Deve ser preenchido
              </div>
            </div>
          </div>

          <div class="text-end">
            <button type="submit" class="btn btn-outline-primary">
              <i class="fa-regular fa-floppy-disk"></i>
            </button>
          </div>

          <input type="hidden" class="form-control" name="id" id="id" />
        </form>
      </section>

      <section>
        <table class="table mt-5" name="tabela" id="tabela">
          <thead>
            <tr>
              <th scope="col">#</th>
              <th scope="col">Data</th>
              <th scope="col">Nome</th>
              <th scope="col">Altura (M)</th>
              <th scope="col">Peso (Kg)</th>
              <th scope="col">IMC</th>
              <th scope="col">Classificação</th>
              <th scope="col"></th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    <script
      src="https://kit.fontawesome.com/1a00d6918d.js"
      crossorigin="anonymous"
    ></script>

    <script src="main.js"></script>
  </body>
</html>
